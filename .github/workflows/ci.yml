name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: 前端（lint / typecheck / test / build）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # **不要**在这里再写 `version:`：`package.json` 的 `packageManager`（pnpm@11.0.9）是
      # 唯一事实来源，两处同时声明会让 action 在 setup 阶段直接失败
      # （Multiple versions of pnpm specified: version 11 vs pnpm@11.0.9）。
      # v4 文档明确写着「Omit `version` input to use the version in the `packageManager` field」。
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  rust:
    name: Rust Control Plane（fmt / clippy / test）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # Tauri 在 Linux 上链接 webkit2gtk，必须先装系统依赖。
      - name: 安装 Tauri Linux 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      # `--nocapture` 是刻意的：真机 E2E 在 runner 上会**明确跳过**并打印原因，
      # 不打开捕获时这些行看不到，日志里只剩「1 passed」，看起来像通过。
      # 本仓库的验收文档（tests/e2e/README.md）本来也都是用 --nocapture 跑的。
      - run: cargo test --manifest-path src-tauri/Cargo.toml -- --nocapture

  python:
    name: Python sidecar（unittest）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --project python python -m unittest discover -s python/tests -t python -v
